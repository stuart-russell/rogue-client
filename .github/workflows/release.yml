name: release

# Releases are driven by the version in pubspec.yaml:
#
#   1. Bump `version: 0.2.0+3` and push/merge to main.
#   2. If `v0.2.0` is not tagged yet, this workflow builds Windows + Android,
#      hashes the artifacts, writes manifest.json, creates the tag and publishes
#      the GitHub release.
#   3. Pushes that do not change the version only run the checks.
#
# Tagging by hand still works and takes precedence for the release notes:
#   git tag -a v0.3.0 -m "What's new" && git push origin v0.3.0
#
# Installed apps poll
#   https://github.com/<owner>/<repo>/releases/latest/download/manifest.json
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases race over the same tag/assets.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  # Reads the version, decides whether it has already been released.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      name: ${{ steps.version.outputs.name }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2)
          name=${version%%+*}
          build=${version#*+}
          if [ "$build" = "$version" ]; then build=0; fi
          {
            echo "name=$name"
            echo "build=$build"
            echo "tag=v$name"
          } >> "$GITHUB_OUTPUT"
          echo "Version $name (build $build)"
      - name: Release only when the tag is new
        id: decide
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A tag push is an explicit release request.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" = "$TAG" ]; then
            echo "Tag $TAG pushed explicitly — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is new — building a release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter compact

  windows:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release
        shell: pwsh
        env:
          ROGUE_UPDATE_MANIFEST: https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
          # Optional: bake portal presets into release builds. Values are masked
          # in logs; leave the secrets unset for a public build with no presets.
          ROGUE_PORTALS: ${{ secrets.ROGUE_PORTALS }}
          ROGUE_DEFAULT_SERVER: ${{ secrets.ROGUE_DEFAULT_SERVER }}
        run: ./tool/build_windows.ps1
      - name: Pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/rogue-client-windows.zip"
          Get-FileHash "dist/rogue-client-windows.zip" -Algorithm SHA256
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.name }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$env:APP_VERSION" `
                  "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
                  "/DOutputDir=$PWD\dist" `
                  "tool\installer\rogue.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash "dist/rogue-client-setup.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  android:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Optional: add these two repository secrets to sign release APKs with a
      # stable key. Android refuses an update signed by a different key, and
      # each CI runner generates a fresh debug key, so APKs built without this
      # can be installed but not upgraded.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          fi
      - run: flutter pub get
      - name: Build APK
        env:
          ROGUE_PORTALS: ${{ secrets.ROGUE_PORTALS }}
          ROGUE_DEFAULT_SERVER: ${{ secrets.ROGUE_DEFAULT_SERVER }}
        run: |
          defines=()
          if [ -n "$ROGUE_PORTALS" ]; then
            defines+=("--dart-define=ROGUE_PORTALS=$ROGUE_PORTALS")
          fi
          if [ -n "$ROGUE_DEFAULT_SERVER" ]; then
            defines+=("--dart-define=ROGUE_DEFAULT_SERVER=$ROGUE_DEFAULT_SERVER")
          fi
          flutter build apk --release \
            --dart-define=ROGUE_VERSION=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2) \
            --dart-define=ROGUE_UPDATE_MANIFEST=https://github.com/${{ github.repository }}/releases/latest/download/manifest.json \
            "${defines[@]}"
      - name: Collect
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/rogue-client.apk"
          sha256sum dist/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: [prepare, checks, windows, android]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          name="${{ needs.prepare.outputs.name }}"
          notes=$(git tag -l --format='%(contents)' "$tag" 2>/dev/null || true)
          if [ -z "$notes" ]; then
            previous=$(git describe --tags --abbrev=0 --exclude="$tag" 2>/dev/null || true)
            if [ -n "$previous" ]; then
              changes=$(git log --no-merges --pretty='- %s' "$previous..HEAD")
            else
              changes=$(git log --no-merges --pretty='- %s' -n 20)
            fi
            if [ -n "$changes" ]; then
              notes=$(printf 'Rogue %s\n\n%s' "$name" "$changes")
            else
              notes="Rogue $name"
            fi
          fi
          printf '%s\n' "$notes" > dist/notes.md
          echo "--- notes ---"
          cat dist/notes.md
      - name: Write manifest
        run: |
          node tool/make_manifest.mjs \
            --version "${{ needs.prepare.outputs.name }}" \
            --build "${{ needs.prepare.outputs.build }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --windows "dist/rogue-client-windows.zip" \
            --android "dist/rogue-client.apk" \
            --notes dist/notes.md \
            --out dist/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Rogue ${{ needs.prepare.outputs.name }}
          body_path: dist/notes.md
          files: |
            dist/rogue-client-windows.zip
            dist/rogue-client-setup.exe
            dist/rogue-client.apk
            dist/manifest.json
          fail_on_unmatched_files: true
